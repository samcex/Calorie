<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-shell">
    <div class="status-row">
      <span id="statusTime">09:29</span>
      <div class="status-icons">
        <span>●●●</span>
      </div>
    </div>

    <header class="top-header">
      <h1>Today</h1>
      <p id="weekLabel">Week 01</p>
    </header>

    <section class="section-head">
      <h2>Summary</h2>
      <button class="text-link" id="openDetailsButton" type="button">Details</button>
    </section>

    <section class="card summary-card">
      <div class="summary-grid">
        <div class="summary-col">
          <strong id="todayEaten">0</strong>
          <span>Eaten</span>
        </div>
        <div class="ring-wrap">
          <div class="ring" id="calorieRing">
            <div class="ring-inner">
              <strong id="remainingCalories">0</strong>
              <span>Remaining</span>
            </div>
          </div>
        </div>
        <div class="summary-col">
          <strong id="todayBurned">0</strong>
          <span>Burned</span>
        </div>
      </div>

      <div class="macro-row">
        <div class="macro-item">
          <span>Carbs</span>
          <div class="bar"><i id="carbsBar"></i></div>
          <small id="carbsText">0 / 0 g</small>
        </div>
        <div class="macro-item">
          <span>Prot</span>
          <div class="bar"><i id="proteinBar"></i></div>
          <small id="proteinText">0 / 0 g</small>
        </div>
        <div class="macro-item">
          <span>Fat</span>
          <div class="bar"><i id="fatBar"></i></div>
          <small id="fatText">0 / 0 g</small>
        </div>
      </div>
    </section>

    <section class="section-head">
      <h2>Nutrition</h2>
      <button class="text-link" id="openNutritionButton" type="button">More</button>
    </section>

    <section class="card list-card" id="nutritionList"></section>

    <section class="section-head">
      <h2>Water Tracker</h2>
    </section>

    <section class="card water-card">
      <div class="water-top">
        <p>Water</p>
        <small>Goal: <span id="waterGoalText">3.00</span> L</small>
      </div>
      <strong id="waterAmount">0.00 L</strong>
      <div class="cups-row" id="cupsRow"></div>
      <div class="water-actions">
        <button type="button" class="small-action" id="waterMinus">-0.25 L</button>
        <button type="button" class="small-action" id="waterPlus">+0.25 L</button>
      </div>
    </section>

    <section class="section-head">
      <h2>Measurements</h2>
      <button class="text-link" id="openWeightButton" type="button">More</button>
    </section>

    <section class="card measure-card">
      <small>Weight</small>
      <p>Goal: <span id="weightGoalLabel">0.0 kg</span></p>
      <div class="weight-row">
        <button type="button" class="round-btn" id="weightDown">−</button>
        <strong id="currentWeightLabel">0.0 kg</strong>
        <button type="button" class="round-btn" id="weightUp">+</button>
      </div>
    </section>

    <section class="section-head">
      <h2>Activities</h2>
      <button class="text-link" id="openActivityButton" type="button">More</button>
    </section>

    <section class="card activity-card">
      <strong id="stepCountLabel">0 steps</strong>
      <small id="burnedKcalLabel">0.0 kcal</small>
      <div class="progress-track">
        <i id="stepsProgress"></i>
      </div>
      <div class="activity-actions">
        <button type="button" class="small-action" id="stepsMinus">-500</button>
        <button type="button" class="small-action" id="stepsPlus">+500</button>
      </div>
    </section>

    <section class="section-head">
      <h2>Notes</h2>
    </section>

    <section class="card notes-card">
      <p id="latestNoteText">How was your day?</p>
      <button type="button" class="note-button" id="addNoteButton">Add Note</button>
    </section>

    <nav class="bottom-nav">
      <button type="button" class="nav-item is-active">●<span>Home</span></button>
      <button type="button" class="nav-item">●<span>Activity</span></button>
      <button type="button" class="nav-item">●<span>Measure</span></button>
      <button type="button" class="nav-item">●<span>Settings</span></button>
    </nav>
  </main>

  <section class="overlay" id="detailsOverlay" hidden>
    <div class="overlay-card">
      <header class="overlay-head">
        <h3>Details</h3>
        <button id="closeDetailsButton" type="button" class="text-link">Close</button>
      </header>

      <form id="calculatorForm" class="overlay-grid">
        <label>Age<input id="age" type="number" min="10" max="100" required /></label>
        <label>Sex
          <select id="sex">
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </label>
        <label>Height (cm)<input id="heightCm" type="number" min="100" max="250" required /></label>
        <label>Weight (kg)<input id="weightKg" type="number" min="30" max="300" step="0.1" required /></label>
        <label>Activity
          <select id="activityLevel">
            <option value="sedentary">Sedentary</option>
            <option value="light">Light</option>
            <option value="moderate">Moderate</option>
            <option value="very">Very Active</option>
            <option value="athlete">Athlete</option>
          </select>
        </label>
        <label>Goal
          <select id="goal">
            <option value="lose">Lose</option>
            <option value="maintain">Maintain</option>
            <option value="gain">Gain</option>
          </select>
        </label>
        <label>Pace (kg/week)
          <select id="paceKgPerWeek">
            <option value="0.25">0.25</option>
            <option value="0.5">0.50</option>
            <option value="0.75">0.75</option>
            <option value="1">1.00</option>
          </select>
        </label>
        <button type="submit" class="small-action">Update Target</button>
      </form>
      <p id="detailFormMessage" class="detail-form-message" aria-live="polite"></p>

      <p class="detail-kpi">Daily target: <strong id="detailTargetCalories">0 kcal</strong></p>

      <div class="chart-wrap">
        <canvas id="weightChart" aria-label="Weight trend line"></canvas>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
